<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しりすこPAD — X宣伝画像ジェネレータ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    body { margin:0; background:#F5F6F8; font-family:'Noto Sans JP',sans-serif; color:#14161A;
           display:flex; flex-direction:column; align-items:center; gap:14px; padding:24px 14px; }
    h1 { font-size:16px; font-weight:900; margin:0; }
    p.note { font-size:12px; color:#8A9097; margin:0; text-align:center; line-height:1.6; }
    canvas { width:100%; max-width:840px; border-radius:14px; box-shadow:0 10px 34px rgba(20,22,26,0.14); background:#fff; }
    button { padding:12px 22px; border-radius:999px; border:none; cursor:pointer;
             background:linear-gradient(180deg,#46A0FF,#1E78F0); color:#fff;
             font-size:14px; font-weight:800; font-family:inherit;
             box-shadow:0 3px 10px rgba(46,139,255,0.35); }
</style>
</head>
<body>
<h1>📣 しりすこPAD — X宣伝画像 (1200×675)</h1>
<canvas id="ad" width="2400" height="1350"></canvas>
<button onclick="download()">⬇️ PNG を保存 (高解像度)</button>
<p class="note">ClaudeDesign トークンで Canvas 直描き。フォント読込後に自動描画されます。<br>文言・レイアウトを変えたいときはこのファイル (promo/x-ad.html) を編集してください。</p>

<script>
const W = 1200, H = 675;
const canvas = document.getElementById('ad');
const ctx = canvas.getContext('2d');
ctx.scale(2, 2);

/* ===== ClaudeDesign トークン (CLAUDE.md 準拠) ===== */
const CD = {
    text: '#14161A', sub: '#6B7178', faint: '#A4AAB0',
    bg: '#F7F8F9', line: 'rgba(20,22,26,0.07)',
    green: '#18C26B', red: '#FF3D44', amber: '#F59E0B', blue: '#1E78F0',
    attr: { fire: '#FF3D44', water: '#2E8BFF', electric: '#9B4DFF', iron: '#FF8A2B', wind: '#18C26B' },
};
const f = (px, w = 800) => `${w} ${px}px 'Noto Sans JP', sans-serif`;
const rr = (x, y, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
};
const pill = (label, x, y, size, color, bg, weight = 800) => {
    ctx.font = f(size, weight);
    const w = ctx.measureText(label).width + size * 1.5;
    const h = size + 14;
    rr(x, y, w, h, h / 2);
    ctx.fillStyle = bg; ctx.fill();
    ctx.fillStyle = color;
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x + size * 0.75, y + h / 2 + 1);
    ctx.textBaseline = 'alphabetic';
    return w;
};

function draw() {
    /* ===== 背景: CD ニュートラル + 属性色の淡いグロー ===== */
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = CD.bg;
    ctx.fillRect(0, 0, W, H);
    const glow = (x, y, r, color) => {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, color); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    };
    glow(1120, 60, 420, 'rgba(46,139,255,0.10)');
    glow(120, 640, 380, 'rgba(24,194,107,0.08)');
    glow(1150, 620, 320, 'rgba(255,61,68,0.07)');

    /* ===== メイン白カード ===== */
    rr(36, 36, W - 72, H - 72, 30);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = 'rgba(20,22,26,0.05)'; ctx.lineWidth = 1.5; ctx.stroke();

    /* ===== 左カラム ===== */
    const LX = 84;
    // ブランド行
    rr(LX, 84, 52, 52, 15);
    ctx.fillStyle = CD.text; ctx.fill();
    ctx.font = f(28, 900); ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    ctx.fillText('⚔️', LX + 26, 84 + 28);
    ctx.textAlign = 'left';
    ctx.fillStyle = CD.text;
    ctx.font = f(34, 900);
    ctx.fillText('しりすこPAD', LX + 66, 84 + 27);
    ctx.textBaseline = 'alphabetic';
    pill('NIKKE ユニオンレイド運営 PWA', LX + 292, 92, 13, CD.blue, 'rgba(30,120,240,0.10)', 900);

    // ヘッドライン
    ctx.fillStyle = CD.text;
    ctx.font = f(54, 900);
    ctx.fillText('ユニレ運営の全部を、', LX, 218);
    ctx.fillText('この1枚に。', LX, 282);
    ctx.font = f(17, 700);
    ctx.fillStyle = CD.sub;
    ctx.fillText('スクショOCR・自動凸プラン・Push通知で、30人のユニオンが回る。', LX, 322);

    // 機能ピル (2列×3行)
    const feats = [
        ['🧠 最適凸プランを自動算出', CD.blue],
        ['🗓 時間割を全員のスマホに配信', CD.attr.electric],
        ['📷 スクショOCRで凸報告10秒', CD.attr.iron],
        ['🔔 締め凸のお願いをPushで直送', CD.red],
        ['📊 ふるり値でシーズン横断の成長分析', CD.green],
        ['🪞 模擬戦・提出漏れも運営が一目で把握', CD.sub],
    ];
    feats.forEach((ft, i) => {
        const col = i % 2, row = (i / 2) | 0;
        const x = LX + col * 300, y = 356 + row * 52;
        ctx.font = f(15, 800);
        ctx.fillStyle = ft[1];
        ctx.fillText('●', x, y + 16);
        ctx.fillStyle = CD.text;
        ctx.fillText(ft[0], x + 20, y + 16);
    });

    // CTA
    const ctaY = 546;
    ctx.font = f(19, 900);
    const url = 'furu1018.github.io/shirisu-pad';
    const uw = ctx.measureText(url).width + 56;
    const grad = ctx.createLinearGradient(0, ctaY, 0, ctaY + 52);
    grad.addColorStop(0, '#46A0FF'); grad.addColorStop(1, '#1E78F0');
    rr(LX, ctaY, uw, 52, 26);
    ctx.fillStyle = grad; ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.textBaseline = 'middle';
    ctx.fillText('🔗 ' + url, LX + 22, ctaY + 27);
    ctx.textBaseline = 'alphabetic';
    pill('#NIKKE  #ユニオンレイド', LX + uw + 14, ctaY + 10, 14, CD.sub, '#F1F2F4', 800);

    /* ===== 右カラム: 時間割モックアップ ===== */
    const RX = 742, RY = 96, RW = 360;
    rr(RX, RY, RW, 452, 20);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = 'rgba(20,22,26,0.08)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.save();
    ctx.shadowColor = 'rgba(20,22,26,0.16)'; ctx.shadowBlur = 34; ctx.shadowOffsetY = 14;
    rr(RX, RY, RW, 452, 20); ctx.strokeStyle = 'rgba(20,22,26,0.02)'; ctx.stroke();
    ctx.restore();

    ctx.fillStyle = CD.text;
    ctx.font = f(15, 900);
    ctx.fillText('🗓 今日の凸プラン', RX + 18, RY + 30);
    pill('配信済み', RX + RW - 88, RY + 14, 11, CD.green, 'rgba(24,194,107,0.12)', 900);

    // 5ボスヘッダー
    const attrs = ['fire', 'water', 'electric', 'iron', 'wind'];
    const names = ['灼熱', '水冷', '電撃', '鉄甲', '風圧'];
    const colW = (RW - 36 - 40) / 5;
    attrs.forEach((a, i) => {
        const x = RX + 18 + 40 + i * colW;
        rr(x + 2, RY + 46, colW - 4, 34, 9);
        ctx.fillStyle = CD.attr[a]; ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = f(11, 900); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('B' + (i + 1), x + colW / 2, RY + 57);
        ctx.font = f(9, 800);
        ctx.fillText(names[i], x + colW / 2, RY + 71);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    });

    // 時間行 + チップ
    const chip = (colIdx, rowY, label, opts = {}) => {
        const a = attrs[colIdx];
        const x = RX + 18 + 40 + colIdx * colW;
        rr(x + 3, rowY, colW - 6, 26, 7);
        ctx.fillStyle = opts.me ? 'rgba(30,120,240,0.14)' : CD.attr[a] + '1F';
        ctx.fill();
        ctx.strokeStyle = opts.bottleneck ? CD.red : (opts.me ? CD.blue : CD.attr[a] + '55');
        ctx.lineWidth = opts.bottleneck || opts.me ? 2 : 1;
        ctx.stroke();
        ctx.fillStyle = opts.bottleneck ? '#E23036' : CD.text;
        ctx.font = f(10, 800);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(label, x + colW / 2, rowY + 14);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    };
    const hourRow = (label, y, now) => {
        ctx.font = f(10.5, 900);
        ctx.fillStyle = now ? CD.blue : CD.faint;
        ctx.textAlign = 'right';
        ctx.fillText((now ? '▼' : '') + label, RX + 52, y + 17);
        ctx.textAlign = 'left';
        ctx.strokeStyle = CD.line; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(RX + 16, y - 4); ctx.lineTo(RX + RW - 16, y - 4); ctx.stroke();
    };
    let y0 = RY + 96;
    hourRow('20時', y0, false);
    chip(0, y0 + 2, 'ふるり 28.5');
    chip(2, y0 + 2, 'NOB 30.1');
    y0 += 40;
    hourRow('21時', y0, true);
    chip(1, y0 + 2, 'あなた 25.0', { me: true });
    chip(3, y0 + 2, 'にま 21.4');
    chip(4, y0 + 2, 'パン 24.8');
    y0 += 40;
    hourRow('22時', y0, false);
    chip(0, y0 + 2, '⏱MIRIN 19.2', { bottleneck: true });
    // 撃破マーク
    ctx.font = f(11, 900); ctx.fillStyle = CD.green;
    ctx.textAlign = 'center';
    ctx.fillText('💀 撃破', RX + 18 + 40 + 2 * colW + colW / 2, y0 + 18);
    ctx.textAlign = 'left';

    // レベル帯
    y0 += 44;
    rr(RX + 16, y0, RW - 32, 30, 9);
    ctx.fillStyle = 'rgba(24,194,107,0.10)'; ctx.fill();
    ctx.fillStyle = '#0E9455';
    ctx.font = f(12, 900);
    ctx.textBaseline = 'middle';
    ctx.fillText('Lv2 ─ 22時開始 → 💀 翌1時 全撃破想定', RX + 28, y0 + 16);
    ctx.textBaseline = 'alphabetic';

    // 統計チップ列
    y0 += 46;
    const stat = (label, val, x, w, color) => {
        rr(x, y0, w, 58, 12);
        ctx.fillStyle = CD.bg; ctx.fill();
        ctx.font = f(9, 800); ctx.fillStyle = CD.faint;
        ctx.fillText(label, x + 10, y0 + 18);
        ctx.font = f(17, 900); ctx.fillStyle = color || CD.text;
        ctx.fillText(val, x + 10, y0 + 44);
    };
    const sw = (RW - 32 - 16) / 3;
    stat('想定総凸数', '79凸', RX + 16, sw);
    stat('オーバーキル', '2.1B', RX + 24 + sw, sw, CD.green);
    stat('到達予想', 'Lv3 🏆', RX + 32 + sw * 2, sw, CD.blue);

    // 吹き出し (Push通知風)
    const nx = RX - 64, ny = RY + 372;
    ctx.save();
    ctx.shadowColor = 'rgba(20,22,26,0.18)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 8;
    rr(nx, ny, 250, 58, 15);
    ctx.fillStyle = '#14161A'; ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.font = f(12, 900);
    ctx.fillText('🔔 締め凸お願いします🙏', nx + 14, ny + 24);
    ctx.font = f(10.5, 700);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText('B3 残HP 4.2B → あなたなら1凸で削れます', nx + 14, ny + 43);
}

function download() {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'shirisuko-pad-x-ad.png';
    a.click();
}

// フォント読込完了後に描画 (Noto Sans JP が来る前に描くと fallback フォントになる)
if (document.fonts?.ready) {
    document.fonts.load("900 54px 'Noto Sans JP'").then(() => document.fonts.ready).then(draw);
    setTimeout(draw, 1500);   // 保険
} else {
    setTimeout(draw, 600);
}
</script>
</body>
</html>
