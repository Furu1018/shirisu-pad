# ============================================================================
# GitHub Pages デプロイ (GitHub Actions 方式)
# ----------------------------------------------------------------------------
# 旧来の Jekyll ベースの Pages ビルドが断続的に失敗・ハングするため、
# Actions で静的ファイルをそのままアップロードする方式に移行。
# Jekyll 処理なし・ビルドログが Actions タブで確認できる。
# ============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject build id
        # 旧キャッシュHTML検知用: <meta name="app-build" content="dev"> をコミットSHAへ置換
        run: sed -i "s/name=\"app-build\" content=\"dev\"/name=\"app-build\" content=\"${GITHUB_SHA::12}\"/" index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
