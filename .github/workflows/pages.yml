# ============================================================================
# GitHub Pages デプロイ (GitHub Actions 方式)
# ----------------------------------------------------------------------------
# 旧来の Jekyll ベースの Pages ビルドが断続的に失敗・ハングするため、
# Actions で静的ファイルをそのままアップロードする方式に移行。
# Jekyll 処理なし・ビルドログが Actions タブで確認できる。
# ----------------------------------------------------------------------------
# 2026-11-24: actions を Node.js 24 対応の版へ上げた (checkout v7 / configure-pages v6 / upload-pages-artifact v5 / deploy-pages v5)。
#   deploy-pages v4 がアップロード済みの成果物を「Found 0 artifact(s)」で見つけられずに落ちることが続いた
#   (11/24 だけで 7 回・時間をおいて起動し直すと通る回もあった)。同じ時期に「Node.js 20 向けの actions を Node.js 24 で
#   強制的に動かしている」警告が出ていたので、まず版を揃えて切り分ける (原因だと確定したわけではない)。
#   → 版を上げても同じく落ちた (upload の完了の 0.2 秒後に deploy-pages が成果物の一覧を引いて 0 件・その成果物はあとで一覧に出ていた)。
#   成果物の一覧への反映が遅れていると見て、deploy の前に「同じ一覧で成果物が見えるか」を確かめる (下の probe)。
#   upload-pages-artifact v4 以降は隠しファイル (. で始まる) を成果物に入れない — このサイトに要る隠しファイルは無い (.nojekyll / .gitattributes / .gitignore は Actions の公開では使わない)
# ============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Inject build id
        # 旧キャッシュHTML検知用: <meta name="app-build" content="dev"> をコミットSHAへ置換
        run: sed -i "s/name=\"app-build\" content=\"dev\"/name=\"app-build\" content=\"${GITHUB_SHA::12}\"/" index.html
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      # ── 成果物が見えるかの確かめ (2026-11-24) ──
      # deploy-pages v5 は成果物を Results Service の ListArtifacts (@actions/artifact の listArtifacts・この run の分) で探し、
      # 0 件だとそこで止まる。download-artifact も名前で探すときは同じ ListArtifacts (名前で絞る) を引く。
      # download-artifact は外に何も作らないので、何度やり直しても安全 (deploy-pages をやり直すと、要求が届いて返事だけ
      # 失われたときに公開が二重になり得る: Codex 監査)。見えるまで 30 秒 → 90 秒おいて最大 3 回試し、deploy-pages は 1 回だけ動かす。
      # 3 回とも見えなくても deploy-pages は試す (これまでと同じ動きに戻るだけ)。落とした写しは runner の一時置き場で、公開には使わない。
      - name: Probe artifact (1)
        id: probe1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-probe
      - name: Wait before probe (2)
        if: steps.probe1.outcome == 'failure'
        run: sleep 30
      - name: Probe artifact (2)
        id: probe2
        if: steps.probe1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-probe
      - name: Wait before probe (3)
        if: steps.probe2.outcome == 'failure'
        run: sleep 90
      - name: Probe artifact (3)
        id: probe3
        if: steps.probe2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-probe
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
