# ============================================================================
# GitHub Pages デプロイ (GitHub Actions 方式)
# ----------------------------------------------------------------------------
# 旧来の Jekyll ベースの Pages ビルドが断続的に失敗・ハングするため、
# Actions で静的ファイルをそのままアップロードする方式に移行。
# Jekyll 処理なし・ビルドログが Actions タブで確認できる。
# ----------------------------------------------------------------------------
# 2026-11-24: actions を Node.js 24 対応の版へ上げた (checkout v7 / configure-pages v6 / upload-pages-artifact v5 / deploy-pages v5)。
#   v4 系の deploy-pages (Node.js 20 向け) が Node.js 24 で強制的に動かされるようになってから、アップロード済みの成果物を
#   「Found 0 artifact(s)」で見つけられずに落ちることが続いた (11/24 だけで 7 回・時間をおいて起動し直すと通る回もあった)。
#   upload-pages-artifact v4 以降は隠しファイル (. で始まる) を成果物に入れない — このサイトに要る隠しファイルは無い (.nojekyll / .gitattributes / .gitignore は Actions の公開では使わない)
# ============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Inject build id
        # 旧キャッシュHTML検知用: <meta name="app-build" content="dev"> をコミットSHAへ置換
        run: sed -i "s/name=\"app-build\" content=\"dev\"/name=\"app-build\" content=\"${GITHUB_SHA::12}\"/" index.html
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
