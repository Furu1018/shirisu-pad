<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>メンバー: 出られる時間 (ブロックをタップ)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif; color: #3a3f46; background: #f3f4f6; -webkit-font-smoothing: antialiased; }
a { color: #6b3df5; } a:hover { color: #4f2bc4; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: rgba(21,23,28,.45); display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; border-radius: 28px">

  <!-- 下から出るシート -->
  <div style="background: #fff; border-radius: 22px 22px 0 0; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 12px; max-height: 780px; overflow: hidden">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #d7dbe3; align-self: center"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <div style="font-size: 17px; font-weight: 900; color: #15171c">出られる時間</div>
      <button type="button" aria-label="閉じる" style="font: inherit; font-size: 12px; font-weight: 800; border: none; border-radius: 9px; padding: 6px 12px; background: #eef0f3; color: #15171c; cursor: pointer">閉じる</button>
    </div>
    <p style="margin: 0; font-size: 12.5px; font-weight: 600; line-height: 1.6; color: #3a3f46">第46回 ハード日 (10/31 土) に<b>出られるブロック</b>をタップして ON にしてください。<b>1 時間でも出られるブロックは ON</b>。運営はこの情報で、そのブロックに出られる人だけで凸プランを組みます。</p>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{blocks}}" as="b" hint-placeholder-count="7">
        <button type="button" aria-pressed="{{b.pressed}}" style="font: inherit; display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; box-sizing: border-box; min-height: 52px; border-radius: 14px; padding: 10px 14px; cursor: pointer; text-align: left; border: 2px solid {{b.border}}; background: {{b.bg}}; color: {{b.fg}}">
          <span style="display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px; font-weight: 900">{{b.name}}</span>
            <span style="font-size: 11px; font-weight: 700; opacity: .85">{{b.hours}}</span>
          </span>
          <span style="font-size: 12px; font-weight: 900; border-radius: 999px; padding: 4px 10px; background: {{b.pillBg}}; color: {{b.pillFg}}">{{b.state}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; gap: 8px">
      <button type="button" style="font: inherit; flex: 1; font-size: 12.5px; font-weight: 800; border: 1.5px solid #e3e6eb; border-radius: 12px; padding: 10px; background: #fff; color: #3a3f46; cursor: pointer">すべて ON</button>
      <button type="button" style="font: inherit; flex: 1; font-size: 12.5px; font-weight: 800; border: 1.5px solid #e3e6eb; border-radius: 12px; padding: 10px; background: #fff; color: #3a3f46; cursor: pointer">すべて OFF</button>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; background: #f3f4f6; border-radius: 12px; padding: 10px 12px">
      <input id="flex" type="checkbox" style="width: 18px; height: 18px; margin: 0">
      <label for="flex" style="font-size: 12.5px; font-weight: 700; color: #3a3f46; line-height: 1.5">隙間時間型 (どのブロックでも声がかかれば動ける)</label>
    </div>

    <button type="button" style="font: inherit; font-size: 15px; font-weight: 900; border: none; border-radius: 14px; padding: 15px; background: #6b3df5; color: #fff; cursor: pointer; box-shadow: 0 6px 16px rgba(107,61,245,.28)">この時間で参加します</button>
    <button type="button" style="font: inherit; font-size: 13px; font-weight: 800; border: none; border-radius: 12px; padding: 11px; background: #fff; color: #6a717b; cursor: pointer">今回は難しい (計算から外す)</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const defs = [
      ['朝', '5〜8時', 'off'], ['午前', '9〜11時', 'off'], ['昼', '12〜14時', 'off'], ['午後', '15〜17時', 'off'],
      ['夕方', '18〜20時', 'on'], ['夜', '21〜23時', 'on'], ['深夜', '翌0〜4時', 'partial'],
    ];
    const blocks = defs.map(([name, hours, st]) => ({
      name, hours, pressed: st === 'on' ? 'true' : 'false',
      state: st === 'on' ? 'ON' : st === 'partial' ? '一部 (2/5 時間)' : 'OFF',
      border: st === 'on' ? '#6b3df5' : st === 'partial' ? '#c9b8ff' : '#e3e6eb',
      bg: st === 'on' ? '#6b3df5' : st === 'partial' ? '#f1edff' : '#fff',
      fg: st === 'on' ? '#fff' : '#15171c',
      pillBg: st === 'on' ? 'rgba(255,255,255,.22)' : st === 'partial' ? '#e9e3ff' : '#eef0f3',
      pillFg: st === 'on' ? '#fff' : st === 'partial' ? '#4f2bc4' : '#6a717b',
    }));
    return { blocks };
  }
}
</script>
</body>
</html>
