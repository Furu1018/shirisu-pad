<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>メンバー: 予約の申請</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif; color: #3a3f46; background: #f3f4f6; -webkit-font-smoothing: antialiased; }
a { color: #6b3df5; } a:hover { color: #4f2bc4; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: rgba(21,23,28,.45); display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; border-radius: 28px">

  <div style="background: #fff; border-radius: 22px 22px 0 0; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 12px; max-height: 800px; overflow: hidden">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #d7dbe3; align-self: center"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <div style="font-size: 17px; font-weight: 900; color: #15171c">予約 <span style="font-size: 12px; font-weight: 800; color: #6a717b">希望がある人だけ</span></div>
      <a href="MemberHome.dc.html" aria-label="閉じる" style="font-size: 12px; font-weight: 800; text-decoration: none; border-radius: 9px; padding: 6px 12px; background: #eef0f3; color: #15171c">閉じる</a>
    </div>
    <p style="margin: 0; font-size: 12.5px; font-weight: 600; line-height: 1.6; color: #3a3f46">「この時間に、このPTで凸したい」が先に決まっているときだけ。運営が承認すると固定され、ホームの凸に出ます。</p>

    <!-- ① いつ -->
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 12px; font-weight: 900; color: #15171c">① いつ <span style="font-weight: 700; color: #6a717b">出られる時間帯から</span></div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{blocks}}" as="b" hint-placeholder-count="7">
          <button type="button" aria-pressed="{{b.pressed}}" style="font: inherit; font-size: 10.5px; font-weight: 900; border-radius: 8px; padding: 7px 2px; border: 2px solid {{b.border}}; background: {{b.bg}}; color: {{b.fg}}; cursor: pointer">{{b.name}}</button>
        </sc-for>
      </div>
      <div style="font-size: 11.5px; font-weight: 700; color: #6a717b; line-height: 1.5">時刻はブロックの中で運営が決めます (1 時間単位の指定はしません)</div>
    </div>

    <!-- ② どの PT -->
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 12px; font-weight: 900; color: #15171c">② どの PT で <span style="font-weight: 700; color: #6a717b">登録された模擬から · 行き先のボスは PT で決まります</span></div>
      <sc-for list="{{mocks}}" as="m" hint-placeholder-count="5">
        <label style="display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 8px 10px; border: 2px solid {{m.border}}; background: {{m.bg}}; cursor: pointer">
          <input type="radio" name="pt" checked="{{m.checked}}" style="width: 16px; height: 16px; margin: 0">
          <span style="flex: none; width: 58px; font-size: 10.5px; font-weight: 900; border-radius: 999px; padding: 3px 0; text-align: center; color: #fff; background: {{m.color}}">{{m.pt}}</span>
          <span style="display: inline-flex; gap: 3px"><span style="width: 18px; height: 18px; border-radius: 5px; background: #d7dbe3"></span><span style="width: 18px; height: 18px; border-radius: 5px; background: #d7dbe3"></span><span style="width: 18px; height: 18px; border-radius: 5px; background: #d7dbe3"></span><span style="width: 18px; height: 18px; border-radius: 5px; background: #d7dbe3"></span><span style="width: 18px; height: 18px; border-radius: 5px; background: #d7dbe3"></span></span>
          <span style="margin-left: auto; font-size: 12.5px; font-weight: 900; color: #15171c; font-variant-numeric: tabular-nums">{{m.dmg}}</span>
          <span style="font-size: 10.5px; font-weight: 800; color: #6a717b; min-width: 54px; text-align: right">{{m.boss}}</span>
        </label>
      </sc-for>
    </div>

    <!-- まとめ -->
    <div style="border-radius: 12px; background: #f1edff; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 13.5px; font-weight: 900; color: #4f2bc4">夕方 (18〜20時) に 風圧PT 編成① で B3 ベヒモス へ (模擬 28.1B)</div>
      <div style="font-size: 11.5px; font-weight: 700; color: #4f2bc4; line-height: 1.5">夕方の 2 凸のうち 1 凸をこれに使います。承認されるまでは運営の割当のままです。</div>
    </div>

    <button type="button" style="font: inherit; font-size: 15px; font-weight: 900; border: none; border-radius: 14px; padding: 15px; background: #6b3df5; color: #fff; cursor: pointer; box-shadow: 0 6px 16px rgba(107,61,245,.28)">この内容で申請する</button>
    <a href="MemberHome.dc.html" style="text-decoration: none; text-align: center; font-size: 13px; font-weight: 800; border-radius: 12px; padding: 11px; color: #6a717b">予約しない (運営の割当にまかせる)</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const blocks = [['朝', 'on'], ['午前', 'na'], ['昼', 'na'], ['午後', 'na'], ['夕方', 'sel'], ['夜', 'na'], ['深夜', 'na']].map(([name, st]) => ({
      name, pressed: st === 'sel' ? 'true' : 'false',
      border: st === 'sel' ? '#6b3df5' : st === 'on' ? '#c9b8ff' : '#eef0f3',
      bg: st === 'sel' ? '#6b3df5' : '#fff', fg: st === 'sel' ? '#fff' : st === 'on' ? '#4f2bc4' : '#c2c7cf',
    }));
    const mocks = [
      ['灼熱PT', '#e5484d', '25.0B', 'B1 撃破済', false], ['水冷PT', '#2f80ed', '19.8B', '→ B4', false], ['電撃PT', '#8b5cf6', '22.4B', 'B2 撃破済', false],
      ['鉄甲PT', '#d97706', '16.2B', '→ B5', false], ['風圧PT', '#18c26b', '28.1B', '→ B3', true],
    ].map(([pt, color, dmg, boss, sel]) => ({ pt, color, dmg, boss, checked: sel ? 'true' : 'false', border: sel ? '#6b3df5' : '#e3e6eb', bg: sel ? '#f1edff' : '#fff' }));
    return { blocks, mocks };
  }
}
</script>
</body>
</html>
